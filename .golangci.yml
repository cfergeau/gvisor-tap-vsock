version: "2"
run:
  timeout: 10m
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - revive
    - errcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - paramTypeCombine
        - importShadow
        - appendCombine
    revive:
      rules:
      - name: var-naming
        disabled: true
    staticcheck:
      checks:
      - '-SA4023' # golangci-lint 2.13.0 triggers https://github.com/dominikh/go-tools/issues/1738
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
